[Heltec_StickLite]
extends = esp32_base
board = heltec_wireless_stick_lite
build_flags =
  ${esp32_base.build_flags}
  -I variants/heltec_sticklite
  -D HELTEC_LORA_V2
  -D RADIO_CLASS=CustomSX1276
  -D WRAPPER_CLASS=CustomSX1276Wrapper
  -D P_LORA_DIO_0=26
  -D P_LORA_DIO_1=35
  -D P_LORA_NSS=18
  -D P_LORA_RESET=14
  -D P_LORA_SCLK=5
  -D P_LORA_MISO=19
  -D P_LORA_MOSI=27
  -D P_LORA_TX_LED=25
  -D SX127X_CURRENT_LIMIT=120
  -D LORA_TX_POWER=20
  -D PIN_BOARD_SDA=4
  -D PIN_BOARD_SCL=15
  -D PIN_USER_BTN=0
  -D PIN_OLED_RESET=16
build_src_filter = ${esp32_base.build_src_filter}
  +<../variants/heltec_sticklite>
  +<helpers/ui/BaseUITask.cpp>
lib_deps =
  ${esp32_base.lib_deps}
  adafruit/Adafruit SSD1306 @ ^2.5.13

[env:Heltec_StickLite_Sensor]
extends = Heltec_StickLite
build_flags =
  ${Heltec_StickLite.build_flags}
  -I src/helpers/ui/server
  -D ADVERT_NAME='"Heltec Sensor"'
  -D ADVERT_LAT=0.0
  -D ADVERT_LON=0.0
  -D ADMIN_PASSWORD='"password"'
  -D ENV_PIN_SDA=4
  -D ENV_PIN_SCL=15
  -D SENSOR_READ_INTERVAL_SECS=1
;  -D DISPLAY_CLASS=SSD1306Display
;  -D MESH_PACKET_LOGGING=1
;  -D MESH_DEBUG=1
build_src_filter = ${Heltec_StickLite.build_src_filter}
 ; +<helpers/ui/SSD1306Display.cpp>
  +<helpers/ui/server>
  +<../examples/simple_sensor>
lib_deps =
  ${Heltec_StickLite.lib_deps}
  ${esp32_ota.lib_deps}
  https://github.com/phuongnamzz/HLK-LD2410S
